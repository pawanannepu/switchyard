# Every gate from AGENTS.md "Tooling" on a macOS runner: format, lint, types,
# tests (Rust over the real socket, Vitest, Playwright through sy-devbridge),
# the dependency table, protocol drift and cargo-deny.
# Actions are pinned to commit SHAs; the comment names the release.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-deny@0.22.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: |
          cargo fmt --all --check
          pnpm format:check

      # Before any cargo step: the Tauri crate embeds apps/desktop/dist at compile time.
      - name: Typecheck and build the UI
        run: |
          pnpm typecheck
          pnpm build

      - name: ESLint
        run: pnpm lint

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Dependency table and protocol drift
        run: |
          pnpm boundaries:check
          pnpm protocol:check

      - name: cargo-deny (licences, advisories, bans, sources)
        run: cargo deny --all-features check

      - name: Rust tests
        run: |
          cargo test --workspace
          cargo test -p sy-daemon --features devtools

      - name: Vitest
        run: pnpm test

      - name: Playwright browsers
        run: pnpm --filter @switchyard/desktop exec playwright install --with-deps webkit

      - name: Playwright
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7
