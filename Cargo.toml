# switchyard Cargo workspace. Layout and dependency rules: docs/specs/0001-stack-architecture/index.md
[workspace]
resolver = "3"
members = [
  "crates/sy-protocol",
  "crates/sy-client",
  "crates/sy-adapter-api",
  "crates/sy-core",
  "crates/sy-infra",
  "crates/sy-adapters/claude",
  "crates/sy-adapters/fake",
  "crates/sy-fake-agent",
  "crates/sy-signal",
  "crates/sy-daemon",
  "crates/sy-devbridge",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Workspace crates
sy-protocol = { path = "crates/sy-protocol" }
sy-client = { path = "crates/sy-client" }
sy-adapter-api = { path = "crates/sy-adapter-api" }
sy-core = { path = "crates/sy-core" }
sy-infra = { path = "crates/sy-infra" }
sy-adapter-claude = { path = "crates/sy-adapters/claude" }
sy-adapter-fake = { path = "crates/sy-adapters/fake" }

# Third party
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
portable-pty = "0.9.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["process", "net"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "user"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v7"] }
vte = "0.15.0"

[workspace.lints.rust]
unsafe_code = "deny"
# Doc comments on every `pub` item (AGENTS.md). CI turns warnings into errors.
missing_docs = "warn"

[workspace.lints.clippy]
# Denied outside tests; clippy.toml allows them in tests.
unwrap_used = "deny"
expect_used = "deny"

# From the Tauri template (https://tauri.app/concept/size/#cargo-configuration),
# except `panic`: unwinding lets a panic in one run's supervision fail only
# that run (spec 0004, AC-11), at the cost of a somewhat bigger binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
