[package]
name = "switchyard"
description = "switchyard desktop app host: window, menu bar item, notifications, engine launcher and relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows quirk, cargo#8519).
name = "switchyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

# Rule (spec 0001): sy-protocol, sy-client, tauri and its plugins.
# Never sy-core, sy-infra, sy-daemon or an adapter.
[dependencies]
sy-protocol.workspace = true
sy-client.workspace = true
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
