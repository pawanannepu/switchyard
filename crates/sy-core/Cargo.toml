[package]
name = "sy-core"
description = "switchyard domain and orchestration. Defines the ports; knows no OS, no agent, no storage library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Rule (spec 0001): sy-adapter-api, serde, tokio, thiserror, tracing; spec 0002 adds
# uuid (typed ids) and async-trait (the `Store` port is used as `Arc<dyn Store>`).
# Never sy-infra, an adapter, tauri, rusqlite, portable-pty, keyring. No cfg(target_os) code.
[features]
# Storage test doubles that fail on demand (`faults`), for the daemon's devtools build and tests.
faults = []

[dependencies]
sy-adapter-api.workspace = true
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
