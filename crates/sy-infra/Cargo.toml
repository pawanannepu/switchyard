[package]
name = "sy-infra"
description = "switchyard infrastructure: the operating system specific implementations of sy-core's ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Rule (spec 0001): may use sy-core (to implement its ports), rusqlite, portable-pty, keyring.
# Never sy-daemon, tauri, or an adapter. Those libraries arrive with the features that need them.
[dependencies]
sy-core.workspace = true
sy-adapter-api.workspace = true
async-trait.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
portable-pty.workspace = true
rustix = { workspace = true, features = ["process"] }
sysinfo.workspace = true
tracing.workspace = true

[dev-dependencies]
sy-core = { workspace = true, features = ["faults"] }
rustix = { workspace = true, features = ["fs", "process"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
