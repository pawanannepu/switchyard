# cargo-deny: licences, advisories, bans and sources for the Rust workspace.
# Run with `cargo deny --all-features check`. CI runs it on every push and PR.

[graph]
# The shipped targets. Linux and Windows join here with feature 35.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[advisories]
# Every RustSec advisory fails the check unless it is listed here with a reason.
ignore = []
# Unmaintained notices fail only for crates we depend on directly.
unmaintained = "workspace"

[licenses]
# Permissive licences, plus MPL-2.0 (file level copyleft, which Tauri's HTML
# stack pulls in). These are compatible with any open source licence the
# project picks (spec 0001 follow up), so this list doesn't presume that choice.
# Revisit it when the project licence is chosen.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are `publish = false` and carry no licence field yet.
ignore = true

[bans]
# Tauri brings several majors of some crates; flag them, don't fail.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
